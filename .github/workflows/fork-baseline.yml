name: Piik baseline (fork)

on:
  push:
    branches:
      - build/piik-baseline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out Piik
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build browser UI for embedding
        run: npm run build:web

      - name: Type-check browser UI
        run: npm run typecheck

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: go.sum

      - name: Build Linux server with embedded web UI
        run: |
          mkdir -p build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o build/piik-server ./cmd/piik-server
          test -s build/piik-server
          test -s internal/server/webassets/dist/index.html

      - name: Smoke-test server locally (no public deployment)
        shell: bash
        run: |
          set -euo pipefail
          ./build/piik-server --check-config
          ./build/piik-server > "$RUNNER_TEMP/piik-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/healthz | grep -q '"status":"ok"'; then
              echo "Piik server health check passed"
              node scripts/fork-room-smoke.mjs
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/piik-server.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/piik-server.log"
          exit 1

      - name: Locate Chromium on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          for browser in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$browser" >/dev/null 2>&1; then
              echo "CHROME_PATH=$(command -v "$browser")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No Chrome/Chromium available on GitHub runner" >&2
          exit 1

      - name: Verify Piik room video in two real browser pages
        env:
          BENCHMARK_VIEWERS: '1'
          BENCHMARK_DURATION_SECONDS: '3'
          BENCHMARK_SETTLE_SECONDS: '1'
          BENCHMARK_PROFILE: '720p30'
          BENCHMARK_CODEC_MODE: 'auto'
          BENCHMARK_OUTPUT: build/fork-media/room-video.json
        run: npx --no-install tsx scripts/peer-assisted-benchmark.ts

      - name: Verify Piik product WebRTC video and synthetic audio
        if: ${{ !cancelled() }}
        run: |
          npx --no-install tsx scripts/browser-local-pool-probe.ts carrier --av --single
          node scripts/fork-av-assert.mjs

      - name: Upload media test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: piik-fork-media-evidence
          path: |
            build/fork-media/room-video.json
            build/browser-local-pool/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Package Linux server preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/piik-preview
          cp build/piik-server build/piik-preview/
          cp LICENSE build/piik-preview/
          cp public/third-party-licenses.txt build/piik-preview/
          tar -czf build/piik-preview-linux-amd64.tar.gz -C build/piik-preview .

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: piik-preview-linux-amd64
          path: build/piik-preview-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7
